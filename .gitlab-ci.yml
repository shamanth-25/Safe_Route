stages:
  - test
  - build
  - deploy

# ==========================
# Backend Checks (FastAPI)
# ==========================
backend_checks:
  stage: test
  image: python:3.11-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    paths:
      - .cache/pip
  script:
    - cd backend
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - python -m compileall .

# ==========================
# Frontend Checks (React/Vite)
# ==========================
frontend_checks:
  stage: test
  image: node:20-alpine
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    paths:
      - .npm
      - frontend/node_modules
  script:
    - cd frontend
    - npm install
    - npm run build

# ==========================
# Backend Docker Build Check
# ==========================
build_backend_docker:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t safepath-backend:latest backend/

# ==========================
# Frontend Docker Build Check
# ==========================
build_frontend_docker:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t safepath-frontend:latest frontend/

# ==========================
# GitLab Pages Deployment
# ==========================
pages:
  stage: deploy
  image: node:20-alpine

  script:
    - cd frontend
    - npm install
    - npm run build
    - mv dist ../public

  artifacts:
    paths:
      - public

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH