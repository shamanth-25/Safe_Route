services:
  # 1. FastAPI Python Spatial Backend (Docker Service)
  - type: web
    name: safepath-backend
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: ORS_API_KEY
        value: "YOUR_ORS_API_KEY"

  # 2. Vite React Frontend (Static Site Service)
  - type: static
    name: safepath-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: safepath-backend
          property: host
